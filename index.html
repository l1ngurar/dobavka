.card.batch-card-out{position:fixed;z-index:12;pointer-events:none;overflow:hidden;margin:0;transform-origin:center 32%;box-shadow:0 8px 24px #0002}
.scan-list{overflow-anchor:none;margin-top:7px;padding:0 0 1px}.scan-tools{margin-top:9px;gap:6px;flex-wrap:nowrap}.scan-tools button{flex:none;white-space:nowrap;min-height:36px;padding:7px 10px;font-size:var(--type-control)}
.scan-list .scan-item{display:flex;align-items:center;justify-content:space-between;flex-wrap:nowrap;margin:0;border:1px solid color-mix(in srgb,var(--line) 70%,transparent);background:var(--surface)}
.scan-list .scan-item .scan-code{min-width:0;white-space:nowrap}
.scan-list .scan-item .remove-scan{flex:none;display:grid;place-items:center}
.remove-scan::before,.remove-scan::after,.clear-model::before,.clear-model::after,.clear-scan::before,.clear-scan::after{content:"";grid-area:1/1;width:11px;height:2px;border-radius:1px;background:currentColor;transform:rotate(45deg)}
.remove-scan::after,.clear-model::after,.clear-scan::after{transform:rotate(-45deg)}
.clear-model,.scan .clear-scan{display:grid;place-items:center}
button:is(.remove-scan,.clear-model,.clear-scan):hover:not(:disabled){border-color:transparent}
button:is(.remove-scan,.clear-model,.clear-scan):focus-visible{outline-color:var(--muted)}
.scan-list .scan-item+.scan-item{margin-top:6px}
.scan-list .scan-item:hover,.scan-list .scan-item:focus-within{background:color-mix(in srgb,var(--surface) 77%,var(--blue-soft))}
.scan-empty{padding:8px 10px;font-size:var(--type-label)}
[data-scan-jump]{display:inline-flex;align-items:center;gap:5px}[data-scan-jump] svg{width:16px;height:16px;flex:none}
.scroll-fade{
  mask-image:linear-gradient(to bottom,transparent,black var(--fade-top,0px),
    black calc(100% - var(--fade-bottom,0px)),transparent);
}
small{font-size:var(--type-meta)}
#workspace .card:has(>#workLeft:not([hidden])),
.supplier-card:has(>#workRight:not([hidden])){
  display:flex;
  flex-direction:column;
  max-height:var(--workspace-card-limit,calc(100dvh - 110px));
  overflow-y:auto;
}
#workLeft:not([hidden]),.supplier-work-layout:not([hidden]){
  display:flex;
  flex-direction:column;
  min-height:0;
}
#workLeft>.spread,#workLeft>.setup,#workLeft>.actions,
.supplier-work-layout>.spread,.supplier-work-layout>.actions{flex:none}
#workLeft>.scan-station,#workLeft .scan-results{display:flex;flex-direction:column;min-height:0}
#workLeft .scan,#workLeft .scan-results-title,#workLeft .scan-tools{flex:none}
#workLeft>.scan-station{min-height:210px}
#workLeft .scan-list{min-height:44px;overscroll-behavior-y:contain}
.supplier-work-layout>.stack{min-height:40px;overflow-y:auto;overscroll-behavior-y:contain}
@media(min-width:879px){

}
.model-label-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.model-label-row .error-flag{display:inline-flex;align-items:center;gap:6px;padding:4px 7px;border:0;background:transparent;color:var(--muted);font-size:var(--type-label);line-height:1.3}
.error-control{display:inline-flex;align-items:center;font-size:var(--type-label);line-height:1.3}
.error-control:has(.error-flag:disabled) kbd{opacity:.45}
.start-preview .error-control kbd{visibility:hidden}
.error-flag::before{content:"";width:10px;height:10px;border:1px solid currentColor;border-radius:50%}
.error-flag[aria-pressed=true]{color:#805a00}
@media(prefers-color-scheme:dark){.error-flag[aria-pressed=true]{color:#ffd15c}}
.error-flag[aria-pressed=true]::before{background:currentColor}
#appConfirm{width:min(440px,92vw)}
#appConfirm h2{margin:0;font-size:var(--type-heading)}
#appConfirmMessage{white-space:pre-line;overflow-wrap:anywhere;margin:10px 0 18px;color:var(--muted)}
#appConfirm .row{justify-content:flex-end}
.confirm-danger{background:var(--red);color:var(--surface);border-color:transparent}
@media(prefers-reduced-motion:no-preference){
  #appConfirm[open]{animation:confirm-in 240ms cubic-bezier(.22,.72,.25,1) both}
  @keyframes confirm-in{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
}
.color-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:stretch}
.color-grid:has(> button:last-child:is(:nth-child(2),:nth-child(4))){grid-template-columns:repeat(2,minmax(0,1fr));width:calc((100% - 4px) * 2 / 3)}
.color-grid button{min-width:0;padding-inline:8px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.color-grid>small{grid-column:1/-1}
.color-grid:has(>button:nth-child(7)){grid-auto-rows:36px;max-height:80px;overflow-y:auto;overscroll-behavior-y:contain;scrollbar-gutter:stable;padding-inline-end:5px}
.batch-line{flex-wrap:nowrap}
.batch-check-hit{display:grid;place-items:center;width:34px;height:34px;flex:none;border-radius:8px}
.batch-check-hit{cursor:pointer}
.batch-check-hit:hover,.batch-check-hit:focus-within{background:var(--surface)}
.batch-check-hit .batch-select{width:17px;height:17px;padding:0}
.batch-actions{display:flex;align-items:center;gap:2px;flex:none}
.batch-actions .icon-action{width:34px;height:34px;padding:0}
.batch-actions .icon-action.danger:hover{color:var(--red)}
@media(hover:hover) and (pointer:fine){
  .batch-actions{opacity:0;pointer-events:none}
  .batch-line:hover .batch-actions,.batch-line:focus-within .batch-actions{opacity:1;pointer-events:auto}
}
@media(prefers-reduced-motion:no-preference){.batch-actions{transition:opacity 160ms ease}}
.batch-quantity{white-space:nowrap}
[data-search-match]{scroll-margin:42px;outline:1px solid var(--blue);outline-offset:-1px;background:var(--blue-soft)}
.search-hit-imei{display:block;width:max-content;max-width:100%;margin-top:3px;padding:1px 4px;border-radius:4px}
.history-table .search-supplier-cell{font-weight:650}
.batch-check-hit:has(input:disabled){opacity:.42;cursor:default;background:transparent}
.batch-check-hit input:disabled{cursor:default}
#searchDialog{width:min(680px,94vw)}
.summary-heart{display:inline-grid;place-items:center;flex:none;width:40px;height:40px;border-radius:12px;padding:0;background:#38383f;color:#fff;font:23px/1 "Segoe UI Symbol",sans-serif}
#summaryTitle{width:46px;height:46px;margin:0;background:#38383f;color:#fff}
#summaryDialog{width:min(520px,92vw);padding:18px;box-shadow:0 20px 60px #0005}
.summary-preview{display:block;width:100%;margin-top:14px;padding:12px 14px;max-height:42vh;resize:none;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--page);color:var(--text);font:600 var(--type-body)/1.65 ui-monospace,Consolas,monospace}
.summary-footer{justify-content:space-between}
#summaryHint{margin:12px 0 0;font-size:var(--type-label)}
#summaryStatus{flex:1}
#searchTitle{margin:0}
.search-entry{position:relative;margin-top:14px}
#searchQuery{width:100%;padding-right:40px}
.history-heading{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.history-copy-number{color:var(--blue);background:var(--blue-soft);font-size:var(--type-meta);white-space:nowrap}
#searchSummary{margin:10px 0;font-size:var(--type-label)}
#searchResults{display:grid;gap:5px;max-height:48vh;overflow:auto}
.search-result{display:grid;gap:3px;width:100%;text-align:left;overflow-wrap:anywhere}
.scan-clear-preview{position:fixed;z-index:14;margin:0;pointer-events:none;overflow:hidden}
@media(prefers-reduced-motion:no-preference){
  #searchDialog[open]{animation:confirm-in 230ms cubic-bezier(.22,.72,.25,1) both}
}
.batch-line .batch-preview-button{display:block;min-width:0;padding:0;border:0;background:transparent;text-align:left;font:inherit;color:inherit;overflow-wrap:anywhere}
.batch-line:not(.batch-selected):has(.batch-preview-button):hover{background:color-mix(in srgb,var(--soft) 56%,var(--blue-soft))}
.search-hit-slot{display:block;overflow:hidden}
#detail.is-batch-preview{width:min(520px,94vw)}
#detailContext{margin:5px 0 0}
.batch-preview-list{margin:0;padding:4px 14px;list-style:none}
.batch-preview-list li{padding:8px 0;border-bottom:1px solid var(--line)}
.batch-preview-list li:last-child{border-bottom:0}
.batch-summary{display:grid;justify-items:end;align-items:center;min-height:34px;overflow:hidden}
.batch-summary>*{grid-area:1/1}
.batch-selection-tools{display:flex;align-items:center;gap:5px;opacity:0;visibility:hidden;transform:translateY(8px);pointer-events:none}
.batch-summary.has-selection>.badge{opacity:0;visibility:hidden;transform:translateY(-8px)}
.batch-summary.has-selection>.batch-selection-tools{opacity:1;visibility:visible;transform:none;pointer-events:auto}
.batch-selection-tools .icon-action{color:var(--red)}
.supplier-line .batch-check-hit{width:26px;height:26px;margin-left:-2px}
@media(prefers-reduced-motion:no-preference){
  .batch-summary>*{transition:transform 230ms cubic-bezier(.22,.72,.25,1),opacity 180ms ease,visibility 0s 230ms}
  .batch-summary:not(.has-selection)>.badge,.batch-summary.has-selection>.batch-selection-tools{transition-delay:0s}
}
.detail-metadata{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;margin-top:10px;color:var(--muted);font-size:var(--type-label);font-variant-numeric:tabular-nums}
.detail-metrics{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.detail-metrics .badge{font-size:var(--type-label);font-weight:500}
.detail-metrics strong{margin-left:3px;color:var(--text);font-weight:700}
</style>
</head>
<body>
<main class="shell">
<header class="top">
<div class="brand">
<div id="homeSlot" class="home-slot" inert><button id="workTab" class="icon nav-icon" aria-label="На главную" title="На главную"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h5v-6h4v6h5V9"/></svg></button><button id="historyBack" class="icon nav-icon" aria-label="Назад" title="Назад" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button></div>
<div><h1 class="title"><span id="appTitle">Добавка</span><span id="workTitle" hidden><button class="title-button" id="draftName" title="Переименовать файл"><span id="draftTitle"></span><span class="rename-mark" aria-hidden="true">✎</span></button><input id="draftNameInput" class="title-input" aria-label="Название добавки" maxlength="100" hidden></span></h1><div class="header-caption">
<small id="homeCaption">Сканирование поставок для Hello Client</small>
<span id="draftContext" class="header-context" aria-hidden="true"></span>
</div></div>
</div>
<nav class="row" aria-label="Разделы">
<div id="historySelection" class="history-selection" hidden><small id="historySelectedCount" role="status"></small></div>
<div class="nav-tools">
<button id="importXlsx" class="nav-icon nav-tool" aria-label="Импорт XLSX" title="Импорт XLSX" inert><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></svg></button>
<input id="importXlsxFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<div id="backupActions" class="backup-actions nav-tool" inert>
<button id="backupMenuButton" class="nav-icon" aria-label="Резервная копия" title="Резервная копия" aria-expanded="false" aria-controls="backupMenu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8v12h16V8M3 4h18v4H3zM10 12h4"/></svg></button>
<div id="backupMenu" class="backup-menu" hidden>
<button id="backup" class="quiet">Скачать резервную копию</button>
<button id="restore" class="quiet">Восстановить из файла</button>
<small>Копия включает историю, текущий черновик, имена поставщиков и IMEI.</small>
</div>
<input id="backupFile" type="file" accept=".json,application/json" hidden>
</div><button id="clearDraft" class="nav-icon nav-tool" aria-label="Очистить добавку" title="Очистить добавку" inert><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"/></svg></button></div><button id="openSearch" class="nav-icon" aria-label="Поиск" title="Поиск (Ctrl+K)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></button><button id="historyTab" class="nav-icon" aria-label="История" title="История"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></button></nav>
</header>
<section id="workspace" class="layout" hidden>
<div>
<section class="card" aria-label="Текущая партия">
<div id="startLeft" hidden></div>
<div id="workLeft">
<div class="spread"><h2 id="batchHeading">Текущая партия</h2><button id="clearParty" class="quiet danger">Очистить партию</button></div>
<div class="setup">
<div class="field wide model-field"><div class="model-label-row"><label class="label" for="model">Название трубки</label><span class="error-control"><kbd aria-hidden="true">Ctrl+E</kbd><button id="markError" class="error-flag" type="button" aria-keyshortcuts="Control+E" title="Ctrl+E" aria-pressed="false">Ошибка</button></span></div><span class="model-entry"><input id="model" role="combobox" aria-autocomplete="both" aria-controls="modelOptions" aria-expanded="false" autocomplete="off" placeholder="Начни вводить модель, например 16 Pro"><span id="memoryGhost" class="memory-ghost" aria-hidden="true"><span id="memoryGhostText"></span></span><button type="button" id="clearModel" class="clear-model" aria-label="Очистить название трубки" title="Очистить название трубки"></button></span><ul class="options" id="modelOptions" role="listbox" hidden></ul></div>
<div id="configBufferSlot" class="wide config-buffer-slot" inert><div class="config-buffer-inner"><button id="configBuffer" class="quiet config-buffer"></button></div></div>
<div class="field"><span>Память</span><div class="chips" id="memories"></div></div>
<div class="field"><span>Цвет</span><div class="chips color-grid" id="colors"></div></div>
</div>
<section class="scan-station" aria-label="Сканирование и сканы партии">
<div class="scan">
<label for="scan">Сканирование IMEI</label>
<form id="scanForm"><div class="scan-entry"><input id="scan" autocomplete="off" inputmode="numeric" placeholder="Сканируй или введи 15 цифр" aria-describedby="scanHelp scanNotice"><button id="clearScanInput" type="button" class="clear-scan" aria-label="Очистить поле IMEI" title="Очистить поле IMEI"></button></div><button type="submit" class="primary">Добавить</button></form>
<div class="scan-feedback">
<small id="scanHelp" class="scan-help"><span><kbd>Enter</kbd> добавить</span><span><kbd>F2</kbd> вернуть фокус</span></small>
<div id="scanNotice" class="scan-error" role="status"></div>
</div>
</div>
<div class="scan-results">
<h3 class="scan-results-title">Сканы партии</h3>
<ul id="scans" class="items scan-list"></ul>
<div class="row scan-tools"><button class="quiet" id="jumpToLastScan" data-scan-jump aria-controls="scans">К последнему <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><button class="quiet" id="undo">Убрать последний</button><button class="quiet danger" id="clearScans">Очистить сканы</button></div>
</div>
</section>
<div class="row actions batch-footer"><button id="closeBatch" class="primary">Следующая партия</button><button id="cancelBatchEdit" class="quiet" hidden>Отменить правку</button><span class="badge" id="batchCount"></span></div>
</div>
</section>
<div id="scanToastSlot"></div>
</div>
<aside>
<section class="card supplier-card" aria-label="Партии">
<div id="startRight" hidden></div>
<div id="workRight" class="supplier-work-layout">
<div class="spread"><h2>Партии</h2><div class="batch-summary" id="batchSummary"><span class="badge" id="total"></span><div class="batch-selection-tools" id="batchSelectionTools" inert><small id="selectedBatchCount" role="status"></small></div></div></div>
<div id="suppliers" class="stack"></div>
<div class="row actions"><button id="saveAddition" class="quiet">Сохранить</button><button id="openSummary" class="quiet summary-heart" aria-label="Выжимка" title="Выжимка"><span aria-hidden="true">♥︎</span></button><button id="finish" class="primary">Скачать XLSX</button></div>
</div>
</section>
<div id="supplierToastSlot"></div>
</aside>
</section>
<section id="history" hidden>
<div id="historyList" class="history-list"></div>
<div id="historyToastSlot"></div>
</section>
<div id="storageError" class="notice error" role="alert" hidden></div>
</main>
<div id="notice" class="action-toast" role="status" hidden></div>
<dialog id="detail" aria-labelledby="detailTitle">
<div class="detail-header"><h2 id="detailTitle"></h2><button id="closeDetail" class="quiet">Закрыть</button></div>
<p id="detailContext" class="muted" hidden></p>
<div id="detailMetadata" class="detail-metadata" hidden><time id="detailSavedAt"></time><div class="detail-metrics"><span class="badge">Трубок <strong id="detailPhoneCount"></strong></span><span class="badge">Поставщиков <strong id="detailSupplierCount"></strong></span></div></div>
<div id="detailBody"></div>
<div class="row actions"><button id="deleteDetailEntry" class="quiet danger" type="button"></button><button id="editHistoryEntry" class="quiet">Редактировать</button><button id="historySummary" class="quiet summary-heart" aria-label="Выжимка" title="Выжимка"><span aria-hidden="true">♥︎</span></button><button id="downloadHistoryEntry" class="primary">Скачать XLSX</button></div>
</dialog>
<dialog id="summaryDialog" aria-label="Выжимка">
<div class="spread"><span id="summaryTitle" class="summary-heart" aria-hidden="true">♥︎</span><form method="dialog"><button class="quiet" autofocus>Закрыть</button></form></div>
<p id="summaryHint" class="muted" hidden></p>
<textarea id="summaryText" class="summary-preview" aria-label="Текст выжимки" readonly rows="2"></textarea>
<div class="row actions summary-footer"><small id="summaryStatus" role="status"></small><button id="copySummary" class="primary">Скопировать</button></div>
</dialog>
<dialog id="searchDialog" aria-labelledby="searchTitle">
<div class="spread"><h2 id="searchTitle">Поиск</h2><button id="closeSearch" class="quiet">Закрыть</button></div>
<div class="search-entry"><input id="searchQuery" aria-label="Поиск по добавкам" placeholder="IMEI, модель, поставщик или имя добавки" autocomplete="off" autofocus><button id="clearSearchQuery" type="button" class="clear-model" aria-label="Очистить поиск" title="Очистить поиск" hidden></button></div>
<p id="searchSummary" class="muted" role="status"></p>
<div id="searchResults"></div>
</dialog>
<dialog id="appConfirm" aria-labelledby="appConfirmTitle" aria-describedby="appConfirmMessage">
<form method="dialog">
<h2 id="appConfirmTitle"></h2>
<p id="appConfirmMessage"></p>
<div class="row"><button class="quiet" id="appConfirmCancel" value="cancel" autofocus>Отмена</button><button class="primary" id="appConfirmAccept" value="accept"></button></div>
</form>
</dialog>

"use strict";

function createXlsx(suppliers) {
  const main = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
  const office = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  const packageRel = "http://schemas.openxmlformats.org/package/2006/relationships";
  const declaration = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const escapeXml = text => text.replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\ufffe\uffff]/g, "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const stringCell = (address, value, quote = false) =>
    `<c r="${address}" t="inlineStr"${quote ? ' s="1"' : ''}><is><t xml:space="preserve">${escapeXml(value)}</t></is></c>`;
  const columns = ["Название", "Категория", "Артикул", "Количество"];
  const rows = [`<row r="1">${columns.map((text, index) => stringCell("ABCD"[index] + "1", text)).join("")}</row>`];
  let row = 2;
  let hasSupplier = false;
  for (const supplier of suppliers) {
    if (!supplier.batches.some(batch => batch.imeis.length)) continue;
    if (hasSupplier) row++;
    hasSupplier = true;
    for (const batch of supplier.batches) {
      const name = batchName(batch);
      for (const imei of batch.imeis) {
        rows.push(`<row r="${row}">${stringCell("A" + row, name)}${stringCell("B" + row, batch.model)}${stringCell("C" + row, imei, true)}<c r="D${row}"><v>1</v></c></row>`);
        row++;
      }
    }
  }
  const files = {
    "[Content_Types].xml": `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`,
    "_rels/.rels": `<Relationships xmlns="${packageRel}"><Relationship Id="rId1" Type="${office}/officeDocument" Target="xl/workbook.xml"/></Relationships>`,
    "xl/workbook.xml": `<workbook xmlns="${main}" xmlns:r="${office}"><sheets><sheet name="Лист1" sheetId="1" r:id="rId1"/></sheets></workbook>`,
    "xl/_rels/workbook.xml.rels": `<Relationships xmlns="${packageRel}"><Relationship Id="rId1" Type="${office}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${office}/styles" Target="styles.xml"/></Relationships>`,
    "xl/styles.xml": `<styleSheet xmlns="${main}"><fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" quotePrefix="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`,
    "xl/worksheets/sheet1.xml": `<worksheet xmlns="${main}"><cols><col min="1" max="1" width="42" customWidth="1"/><col min="2" max="3" width="23" customWidth="1"/><col min="4" max="4" width="15" customWidth="1"/></cols><sheetData>${rows.join("")}</sheetData></worksheet>`
  };
  return zipWorkbook(Object.entries(files).map(([path, xml]) => [path, declaration + xml]));
}

// XLSX is a ZIP container. Store entries without compression to keep export dependency-free.
function zipWorkbook(entries) {
  const encoder = new TextEncoder();
  const crcTable = Uint32Array.from({ length: 256 }, (_, byte) => {
    for (let bit = 0; bit < 8; bit++) byte = (byte >>> 1) ^ ((byte & 1) ? 0xedb88320 : 0);
    return byte;
  });
  const parts = [];
  const directory = [];
  let offset = 0;
  let directorySize = 0;
  for (const [path, xml] of entries) {
    const name = encoder.encode(path);
    const content = encoder.encode(xml);
    let crc = 0xffffffff;
    for (const byte of content) crc = (crc >>> 8) ^ crcTable[(crc ^ byte) & 0xff];
    crc ^= 0xffffffff;

    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);
    local.setUint16(12, 33, true);
    local.setUint32(14, crc, true);
    local.setUint32(18, content.length, true);
    local.setUint32(22, content.length, true);
    local.setUint16(26, name.length, true);

    const central = new DataView(new ArrayBuffer(46));
    central.setUint32(0, 0x02014b50, true);
    central.setUint16(4, 20, true);
    central.setUint16(6, 20, true);
    central.setUint16(14, 33, true);
    central.setUint32(16, crc, true);
    central.setUint32(20, content.length, true);
    central.setUint32(24, content.length, true);
    central.setUint16(28, name.length, true);
    central.setUint32(42, offset, true);

    parts.push(local.buffer, name, content);
    directory.push(central.buffer, name);
    offset += local.byteLength + name.length + content.length;
    directorySize += central.byteLength + name.length;
  }
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, entries.length, true);
  end.setUint16(10, entries.length, true);
  end.setUint32(12, directorySize, true);
  end.setUint32(16, offset, true);
  return new Blob([...parts, ...directory, end.buffer], {
    type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
  });
}

function renumberSuppliers(suppliers) {

      applyModel(completion.spec, completion.memory, completion.color, completion.hasError, completion.color ? undefined : "color");
      return;
    }
    if (!modelOptions.hidden && matches[optionIndex]
        && (editedPart || (modelSearchKey(modelInput.value) && modelInput.value !== modelDisplay(batch())))) {
      event.preventDefault();
      selectOption(optionIndex, true);
      return;
    }
  }
  if (event.key === "ArrowDown" || event.key === "ArrowUp") {
    event.preventDefault();
    if (modelOptions.hidden) { clearMemoryGhost(); showOptions(modelInput.value, true); }
    else if (matches.length) highlightOption((optionIndex + (event.key === "ArrowDown" ? 1 : -1) + matches.length) % matches.length);
  }
  if (event.key === "Enter" && !modelOptions.hidden) {
    event.preventDefault();
    selectOption(optionIndex);
  }
  if (event.key === "Escape") {
    clearMemoryGhost();
    hideOptions();
    modelInput.value = modelDisplay(batch());
  }
});
const draftNameInput = $("draftNameInput");
function closeDraftNameEditor(commit) {
  if (draftNameInput.hidden) return;
  const name = draftNameInput.value.trim();
  if (commit && name && name !== draft().name) {
    draft().name = name;
    save();
    $("draftTitle").textContent = name;
    document.title = name;
  }
  draftNameInput.hidden = true;
  $("draftName").hidden = false;
  animateUpdate($("draftName"));
}
$("draftName").addEventListener("click", () => {
  draftNameInput.value = draft().name;
  draftNameInput.style.width = `clamp(140px, ${Math.ceil($("draftName").getBoundingClientRect().width)}px, 62vw)`;
  $("draftName").hidden = true;
  draftNameInput.hidden = false;
  animateUpdate(draftNameInput);
  draftNameInput.focus();
  draftNameInput.setSelectionRange(draftNameInput.value.length, draftNameInput.value.length);
});
draftNameInput.addEventListener("blur", () => closeDraftNameEditor(true));
draftNameInput.addEventListener("keydown", event => {
  if (event.key === "Enter" || event.key === "Escape") {
    event.preventDefault();
    closeDraftNameEditor(event.key === "Enter");
    $("draftName").focus();
  }
});
$("scan").addEventListener("input", () => scanFeedback());
$("clearScanInput").onclick = () => {
  $("scan").value = "";
  scanFeedback();
  focusScan();
};
$("scanForm").addEventListener("submit", event => {
  event.preventDefault();
  const imei = $("scan").value.trim();
  if (!imei) return;
  if (!filled()) { scanFeedback("Сначала выбери модель, память и цвет."); return; }
  if (!imeiPattern.test(imei)) { scanFeedback("IMEI должен состоять из 15 цифр."); $("scan").select(); return; }
  if (hasImei(imei)) {
    $("scan").value = "";
    scanFeedback("Этот IMEI уже есть в добавке.");
    focusScan();
    return;
  }
  const from = actionRect($("scan"));
  batch().imeis.push(imei);
  $("scan").value = "";
  refresh("IMEI принят.", from);
  animateAcceptedImei(imei, from);
});
$("jumpToLastScan").onclick = () => {
  const scans = $("scans");
  const behavior = matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth";
  scans.scrollTo({ top: scans.scrollHeight, behavior });
  focusScan();
};
$("undo").onclick = () => removeScan(batch().imeis.length - 1);
$("markError").addEventListener("mousedown", event => {
  if (document.activeElement === modelInput && modelCompletion()?.hasError) event.preventDefault();
});
$("markError").onclick = () => {
  const completion = document.activeElement === modelInput ? modelCompletion() : null;
  if (completion?.hasError) {
    applyModel(completion.spec, completion.memory, completion.color, true);
    return;
  }
  batch().hasError = !batch().hasError;
  save();
  renderSetup();
  renderSuppliers();
  animateUpdate(modelInput);
  if (filled()) focusScan();
};
$("configBuffer").onclick = () => {
  const saved = draft().configBuffer;
  if (!saved || draft().editIndex !== null || batch().imeis.length) return;
  delete batch().importedName;
  Object.assign(batch(), saved, { hasError: Boolean(saved.hasError) });
  refresh();
  animateUpdate(modelInput);
};
$("clearModel").onclick = () => {
  const current = batch();
  delete current.importedName;
  delete current.hasError;
  Object.assign(current, { model: "", memory: "", color: "" });
  clearMemoryGhost();
  hideOptions();
  refresh("Название трубки очищено.");
  animateUpdate(modelInput);
  modelInput.focus();
};
$("clearScans").onclick = async () => {
  if (!batch().imeis.length || !await askAction("Очистить сканы?", "Все IMEI текущей партии будут удалены.", "Очистить сканы", { danger: true })) return;
  const scans = $("scans");
  const rect = actionRect(scans);
  const scroll = scans.scrollTop;
  const preview = rect && matchMedia("(prefers-reduced-motion: no-preference)").matches ? scans.cloneNode(true) : null;
  batch().imeis = [];
  refresh("Сканы партии очищены.");
  if (preview) {
    preview.removeAttribute("id");
    preview.querySelectorAll("[id]").forEach(node => node.removeAttribute("id"));
    preview.classList.add("scan-clear-preview");
    preview.inert = true;
    preview.setAttribute("aria-hidden", "true");
    preview.style.cssText = `left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;height:${rect.height}px`;
    document.body.append(preview);
    preview.scrollTop = scroll;
    preview.animate([
      { clipPath: "inset(0 round 10px)", opacity: 1 },
      { clipPath: "inset(0 0 100% 0 round 10px)", opacity: 0.3 }
    ], { duration: 250, easing: "cubic-bezier(.4,0,.3,1)" }).finished.then(() => preview.remove(), () => preview.remove());
  }
};
$("clearParty").onclick = async () => {
  if (!await askAction("Очистить партию?", "Название, конфигурация и IMEI текущей партии будут удалены.", "Очистить партию", { danger: true })) return;
  const before = snapshotBatchCard();
  draft().batch = newBatch();
  $("scan").value = "";
  hideOptions();
  clearMemoryGhost();
  refresh("Партия очищена.");
  animatePartyTransition(before, null);
};
$("closeBatch").onclick = async () => {
  const editing = draft().editIndex !== null;
  const { model, memory, color, hasError } = batch();
  const from = snapshotBatchCard();
  const saved = await closeBatch(true, true);
  if (!saved) return;
  if (!editing) draft().configBuffer = { model, memory, color, hasError };
  refresh("Партия сохранена.");
  if (saved !== true) animatePartyTransition(from, renderedBatchRows.get(saved));
};
$("cancelBatchEdit").onclick = () => {
  const current = draft();
  const edit = current.batchEdit;
  if (!edit) return;
  const from = snapshotBatchCard();
  supplier().batches.splice(current.editIndex, 0, edit.original);
  supplier().batches.sort(compareBatchModels);
  current.batch = edit.previousBatch;
  current.active = edit.previousSupplier;
  current.editIndex = null;
  delete current.batchEdit;
  refresh("Правка отменена.");
  animatePartyTransition(from, renderedBatchRows.get(edit.original));
};
async function finishAddition(wantDownload) {
  const anchor = actionRect(document.activeElement);
  const snapshot = structuredClone(draft());
  if (!await closeBatch(false, true)) return;
  const entry = {
    name: draft().name.trim() || `Добавка от ${dateLabel(timestamp())}`,
    date: timestamp(),
    suppliers: draft().suppliers.filter(group => supplierCount(group) > 0)
  };
  if (!entry.suppliers.length) return;
  let blob;
  if (wantDownload) {
    try {
      blob = createXlsx(entry.suppliers);
    } catch {
      state.draft = snapshot;
      render();
      notify("Не удалось собрать XLSX. Черновик сохранён.", true, anchor);
      return;
    }
  }
  const next = { ...state, draft: newDraft(), history: [entry, ...state.history] };
  if (!save(next)) {
    state.draft = snapshot;
    render();
    notify("История не сохранилась. Черновик всё ещё открыт.", true, anchor);
    return;
  }
  state = next;
  if (blob) download(blob, fileName(entry.name) + ".xlsx");
  resizeWorkspaceCards(true);
  render();
  notify(blob ? "Добавка сохранена. Файл XLSX сформирован." : "Добавка сохранена в истории.", false, anchor);
}
$("saveAddition").onclick = () => finishAddition(false);
$("finish").onclick = () => finishAddition(true);
$("workTab").onclick = () => resizeWorkspaceCards(true);
$("clearDraft").onclick = async () => {
  if (!await askAction("Очистить добавку?", "Партии, IMEI и поставщики текущей добавки будут удалены.", "Очистить добавку", { danger: true })) return;
  const next = { ...state, draft: { ...newDraft(), name: draft().name } };
  if (!save(next)) return;
  state = next;
  $("scan").value = "";
  hideOptions();
  render();
  notify("Добавка очищена.");
  focusScan();
};
$("historyBack").onclick = () => setTab(false, returnToStart);
$("historyTab").onclick = () => {
  if (!$("history").hidden) {
    $("historyBack").click();
    return;
  }
  returnToStart = $("workLeft").hidden;
  setTab(true);
};
$("closeDetail").onclick = () => closeHistoryDetail();
$("detail").addEventListener("close", clearSearchMatch);
$("detail").addEventListener("cancel", event => {
  event.preventDefault();
  closeHistoryDetail();
});
function isDetailBackdrop(event) {
  const dialog = $("detail");
  if (event.target !== dialog) return false;
  const { left, right, top, bottom } = dialog.getBoundingClientRect();
  return event.clientX < left || event.clientX > right || event.clientY < top || event.clientY > bottom;
}
let detailBackdropPressed = false;
$("detail").addEventListener("pointerdown", event => {
  detailBackdropPressed = isDetailBackdrop(event);
});
$("detail").addEventListener("click", event => {
  const close = detailBackdropPressed && isDetailBackdrop(event);
  detailBackdropPressed = false;
  if (close) closeHistoryDetail();
});
const deleteSelectedParties = iconAction("Удалить выбранные партии", "remove", deleteSelectedBatches, "danger");
$("batchSelectionTools").append(deleteSelectedParties);
const deleteSelection = iconAction("Удалить выбранные", "remove", () => deleteHistory(Array.from(selectedHistory)), "danger");
deleteSelection.id = "deleteSelectedHistory";
$("historySelection").append(deleteSelection);
function setBackupMenu(open) {
  $("backupMenu").hidden = !open;
  $("backupMenuButton").setAttribute("aria-expanded", String(open));
}
$("backupMenuButton").onclick = () => {
  const open = $("backupMenu").hidden;
  setBackupMenu(open);
  if (open) $("backup").focus();
};
document.addEventListener("click", event => {
  if (!$("backupMenu").hidden && !$("backupActions").contains(event.target)) setBackupMenu(false);
});
$("backupActions").addEventListener("keydown", event => {
  if (event.key !== "Escape" || $("backupMenu").hidden) return;
  setBackupMenu(false);
  $("backupMenuButton").focus();
});
$("backup").onclick = () => {
  setBackupMenu(false);
  $("backupMenuButton").focus();
  download(new Blob([JSON.stringify(state)], { type: "application/json" }), "dobavka-backup.json");
};
$("restore").onclick = () => {
  setBackupMenu(false);
  $("backupMenuButton").focus();
  $("backupFile").click();
};
$("backupFile").onchange = async event => {
  const file = event.target.files[0];
  event.target.value = "";
  if (!file) return;
  try {
    const restored = validate(JSON.parse(await file.text()));
    if (!await askAction("Восстановить из копии?", "История и текущий черновик будут заменены данными из выбранного файла.", "Восстановить", { danger: true })) return;
    const wasLocked = storageLocked;
    storageLocked = false;
    if (!save(restored)) { storageLocked = wasLocked; return; }
    state = restored;
    render();
    renderHistory();
    updateResumeButton();
  } catch (error) { notify(error.message, true, actionRect($("backupMenuButton"))); }
};
document.addEventListener("keydown", event => {
  if (event.ctrlKey && !event.altKey && !event.shiftKey && !event.metaKey && event.code === "KeyE"
      && !$("workspace").hidden && !$("workLeft").hidden && !document.querySelector("dialog[open]")
      && !$("markError").disabled) {
    event.preventDefault();
    if (!event.repeat) $("markError").click();
    return;
  }
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
    event.preventDefault();
    openSearch();
    return;
  }
  if (event.key === "Escape" && draggingDivider) {
    finishDividerDrag();
    return;
  }
  if (event.key === "F2" && !$("searchDialog").open && !$("workspace").hidden && !$("workLeft").hidden) {
    event.preventDefault();
    focusScan();
  }
});
window.addEventListener("storage", event => {
  if ((event.key === storageKey || event.key === null) && event.newValue !== event.oldValue) {
    storageLocked = true;
    showStorageError("Данные изменились в другой вкладке. Сделай копию этой версии при необходимости и обнови страницу перед продолжением.");
  }
});
function buildStartPreview(workId, startId, slotId, action) {
  const preview = $(workId).cloneNode(true);
  preview.removeAttribute("id");
  const slot = preview.querySelector(`#${slotId}`);
  const actions = slot.parentElement;
  actions.style.visibility = "hidden";
  action.style.visibility = "visible";
  preview.classList.add("start-preview");
  preview.querySelectorAll("[id], [for], [aria-controls], [aria-describedby]").forEach(node => {
    for (const attribute of ["id", "for", "aria-controls", "aria-describedby"]) node.removeAttribute(attribute);
  });
  preview.querySelectorAll("button, input").forEach(node => node.disabled = true);
  for (const node of preview.querySelectorAll("*")) {
    if (node.closest("button, input, .badge")) continue;
    for (const text of Array.from(node.childNodes)) {
      if (text.nodeType !== Node.TEXT_NODE || !text.textContent.trim()) continue;
      const mask = el("span", text.textContent, "placeholder-label");
      mask.setAttribute("aria-hidden", "true");
      text.replaceWith(mask);
    }
  }
  actions.append(action);
  $(startId).replaceChildren(preview);
}

const currentDraft = state.draft;
state.draft = newDraft();
render();
const startNew = button("Новая добавка", startNewDraft, "primary start-action");
startNew.id = "newDraftButton";
function resizeWorkspaceCards(drafts) {
  if (!matchMedia("(prefers-reduced-motion: no-preference)").matches) {
    setTab(false, drafts);
    return;
  }
  const cards = Array.from($("workspace").querySelectorAll(".card"));
  const startHeights = cards.map(card => card.getBoundingClientRect().height);
  setTab(false, drafts);
  const endHeights = cards.map(card => card.getBoundingClientRect().height);
  cards.forEach((card, index) => {
    const from = startHeights[index];
    const to = endHeights[index];
    if (Math.abs(from - to) < 1) return;
    const animation = card.animate([
      { height: `${from}px`, overflow: "clip" },
      { height: `${to}px`, overflow: "clip" }
    ], { duration: 360, easing: "cubic-bezier(.22,.72,.25,1)" });
    animation.id = "workspace-card-size";
  });
}
const startResume = button("", () => {
  workContext = "draft";
  resizeWorkspaceCards(false);
}, "primary start-action resume-action");
startResume.id = "resumeDraft";
const bufferName = el("small");
bufferName.id = "bufferName";
startResume.append(el("span", "Продолжить добавку", "resume-label"), bufferName);
buildStartPreview("workLeft", "startLeft", "closeBatch", startNew);
buildStartPreview("workRight", "startRight", "finish", startResume);
state.draft = currentDraft;
render();
const leftCard = $("workLeft").closest(".card");
const leftCardObserver = new ResizeObserver(([entry]) => {
  const height = entry.borderBoxSize[0].blockSize;
  if (height > 0) $("workspace").style.setProperty("--left-card-height", `${height}px`);
});
leftCardObserver.observe(leftCard, { box: "border-box" });
const workspaceHeader = document.querySelector("header.top");
function fitWorkspaceCards() {
  const header = workspaceHeader.getBoundingClientRect();
  const margin = Number.parseFloat(getComputedStyle(workspaceHeader).marginBottom);
  const top = header.bottom + window.scrollY + margin;
  $("workspace").style.setProperty("--workspace-card-limit", `max(0px, calc(100dvh - ${top + 12}px))`);
}
new ResizeObserver(fitWorkspaceCards).observe(workspaceHeader);
window.addEventListener("resize", fitWorkspaceCards);
fitWorkspaceCards();
setTab(false, true);
const fadeLists = document.querySelectorAll("#scans, #suppliers, #colors, #modelOptions, #searchResults");
function updateScrollFade(list) {
  const overflow = list.scrollHeight - list.clientHeight;
  const fadeDepth = Math.min(28, list.clientHeight / 3);
  const top = Math.max(0, Math.min(fadeDepth, list.scrollTop * 3));
  const bottom = Math.max(0, Math.min(fadeDepth, (overflow - list.scrollTop) * 3));
  list.classList.toggle("scroll-fade", list.clientHeight > 0 && overflow > 1);
  list.style.setProperty("--fade-top", `${top}px`);
  list.style.setProperty("--fade-bottom", `${bottom}px`);
}
const fadeResizeObserver = new ResizeObserver(entries => {
  for (const { target } of entries) updateScrollFade(target);
});
const fadeContentObserver = new MutationObserver(records => {
  const changed = new Set(records.map(record => record.target.closest("#scans, #suppliers, #colors, #modelOptions, #searchResults")));
  for (const list of changed) if (list) updateScrollFade(list);
});
for (const list of fadeLists) {
  list.addEventListener("scroll", () => updateScrollFade(list), { passive: true });
  fadeResizeObserver.observe(list);
  fadeContentObserver.observe(list, { childList: true, subtree: true });
}


</script>
